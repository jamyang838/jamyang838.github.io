<style>
/* Layout：書桌上的一疊單字卡（單欄置中），頂端黑板倒數，底部分頁列；分析頁是卡片流，寬螢幕兩欄。 */
:root {
  --paper: #ecf0eb;
  --card: #ffffff;
  --card-2: #f3f6f2;
  --ink: #15211b;
  --ink-2: #46554d;
  --muted: #69786f;
  --line: #d3dcd5;
  --rule: #e4ecf4;
  --rule-red: #efb8b1;
  --board: #1f4636;
  --board-ink: #eff4ec;
  --board-dim: #b9cbbf;
  --frame: #a07f55;
  --accent: #1d6b4a;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe1;
  --hl: #ffe35a;
  --hl-ink: #3a2f00;
  --yes: #1d7a4e;
  --yes-ink: #ffffff;
  --no: #c4382c;
  --no-soft: #f8e2de;
  --easy: #2d5f8e;
  --easy-soft: #e2ecf6;
  --warn: #9a6a00;
  --focus: #2563c9;
  --scrim: rgba(12, 22, 17, 0.42);
  --shadow-card: 0 1px 1px rgba(21, 33, 27, .06), 0 12px 28px -10px rgba(21, 33, 27, .28);
  --viz-weak: #84bf9f;
  --viz-ok: #3f9670;
  --viz-master: #185236;
  --viz-track: #e2e9e4;
  --heat-0: #e7ece8;
  --heat-1: #84bf9f;
  --heat-2: #55a37e;
  --heat-3: #2d7f5a;
  --heat-4: #185236;
  --viz-bar: #138a55;
  --curve-1: #6aac8a;
  --curve-2: #2f8561;
  --curve-3: #15482f;
  --grid: #e5ebe6;
  --axis: #c2ccc5;
  --font-ui: "Lexend", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-chalk: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "DFKai-SB", "KaiTi", serif;
  --r-card: 10px;
  --r-ui: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1612; --card: #1a2520; --card-2: #16201b; --ink: #e9f0e8; --ink-2: #b1bfb6; --muted: #8a998f;
    --line: #2a3831; --rule: #213029; --rule-red: #5b302b; --board: #183a2c; --board-ink: #eef4ea; --board-dim: #a9bdaf;
    --frame: #7d6443; --accent: #3fa877; --accent-ink: #0b1a12; --accent-soft: #1f3a2d; --hl: #6a5a13; --hl-ink: #fff3c4;
    --yes: #4cb584; --yes-ink: #0b1a12; --no: #ef6c5f; --no-soft: #3d2320; --easy: #8cb8e6; --easy-soft: #1d2d3d; --warn: #e0b04a; --focus: #7fb0ff;
    --scrim: rgba(0, 0, 0, .58); --shadow-card: 0 1px 1px rgba(0, 0, 0, .3), 0 14px 30px -12px rgba(0, 0, 0, .7);
    --viz-weak: #2c7552; --viz-ok: #4fa67c; --viz-master: #9ae6bd; --viz-track: #24332c;
    --heat-0: #1f2b25; --heat-1: #246a49; --heat-2: #368d64; --heat-3: #5bb488; --heat-4: #9ae6bd;
    --viz-bar: #34a36e; --curve-1: #3a8763; --curve-2: #62b98e; --curve-3: #a6e8c4; --grid: #24312a; --axis: #3a4a42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1612; --card: #1a2520; --card-2: #16201b; --ink: #e9f0e8; --ink-2: #b1bfb6; --muted: #8a998f;
  --line: #2a3831; --rule: #213029; --rule-red: #5b302b; --board: #183a2c; --board-ink: #eef4ea; --board-dim: #a9bdaf;
  --frame: #7d6443; --accent: #3fa877; --accent-ink: #0b1a12; --accent-soft: #1f3a2d; --hl: #6a5a13; --hl-ink: #fff3c4;
  --yes: #4cb584; --yes-ink: #0b1a12; --no: #ef6c5f; --no-soft: #3d2320; --easy: #8cb8e6; --easy-soft: #1d2d3d; --warn: #e0b04a; --focus: #7fb0ff;
  --scrim: rgba(0, 0, 0, .58); --shadow-card: 0 1px 1px rgba(0, 0, 0, .3), 0 14px 30px -12px rgba(0, 0, 0, .7);
  --viz-weak: #2c7552; --viz-ok: #4fa67c; --viz-master: #9ae6bd; --viz-track: #24332c;
  --heat-0: #1f2b25; --heat-1: #246a49; --heat-2: #368d64; --heat-3: #5bb488; --heat-4: #9ae6bd;
  --viz-bar: #34a36e; --curve-1: #3a8763; --curve-2: #62b98e; --curve-3: #a6e8c4; --grid: #24312a; --axis: #3a4a42;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 20px; height: 20px; flex: none; }

/* ── Top bar ── */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; flex-direction: column; line-height: 1.05; }
.brand b { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
.brand span { font-family: var(--font-zh); font-size: 11px; color: var(--muted); letter-spacing: .18em; margin-top: 3px; }
.board {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 12px 5px; border-radius: 5px;
  background: var(--board); color: var(--board-ink); font-family: var(--font-chalk); white-space: nowrap;
  box-shadow: inset 0 0 0 3px var(--frame), inset 0 0 0 4px rgba(0, 0, 0, .2);
}
.board small { font-size: 12px; color: var(--board-dim); letter-spacing: .12em; }
.board strong { font-size: 22px; line-height: 1; font-weight: 700; font-variant-numeric: lining-nums; }
.spacer { flex: 1; }
.acct {
  position: relative; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px 0 4px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 500; max-width: 180px;
}
.acct .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--card-2); color: var(--ink-2); overflow: hidden; flex: none; position: relative; }
.acct .av img { width: 100%; height: 100%; object-fit: cover; }
.acct .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sync-dot { position: absolute; left: 26px; top: 25px; width: 11px; height: 11px; border-radius: 50%; background: var(--muted); border: 2px solid var(--card); }
.sync-dot[data-s="saved"] { background: var(--yes); }
.sync-dot[data-s="saving"], .sync-dot[data-s="connecting"] { background: var(--warn); }
.sync-dot[data-s="error"], .sync-dot[data-s="readonly"] { background: var(--no); }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink-2); flex: none; }
@media (max-width: 380px) { .cd-x { display: none; } }
@media (max-width: 359px) { .brand { display: none; } }
@media (max-width: 430px) {
  .brand span { display: none; }
  .acct { padding: 0 3px; }
  .topbar-in { gap: 8px; }
  .acct .nm { display: none; }
}

/* ── Layout ── */
main { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); }
.study { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
.study-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.study-head h1 { font-size: 21px; line-height: 1.2; margin: 0 4px 0 0; font-weight: 700; letter-spacing: -.01em; }
.why-btn { display: inline-flex; align-items: center; gap: 4px; border: none; background: none; color: var(--accent); font-size: 13px; font-weight: 500; padding: 4px 2px; }
.why-btn .ic { width: 16px; height: 16px; }
@media (max-width: 440px) { .why-t { display: none; } .why-btn .ic { width: 20px; height: 20px; } .filter select { max-width: 170px; } }
.filter { margin-left: auto; position: relative; }
.filter select {
  appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 6px 30px 6px 14px; font-size: 13px; font-family: var(--font-zh); max-width: 190px;
}
.filter::after { content: ""; position: absolute; right: 13px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.today { display: grid; gap: 7px; }
.today-nums { display: flex; gap: 6px 16px; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; font-family: var(--font-zh); }
.today-nums b { font-family: var(--font-ui); font-size: 16px; color: var(--ink); font-weight: 600; margin-right: 3px; }
.pbar { height: 6px; border-radius: 3px; background: var(--viz-track); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .35s ease; }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); background: var(--card); border-radius: var(--r-ui); font-size: 13px; font-family: var(--font-zh); }
.banner.focus { border-color: var(--accent); background: var(--accent-soft); }
.banner .grow { flex: 1; min-width: 0; line-height: 1.5; }
.link-btn { border: none; background: none; color: var(--accent); font-weight: 600; padding: 4px 6px; font-size: 13px; white-space: nowrap; }
.reason { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-height: 22px; font-family: var(--font-zh); }
.reason .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.reason[data-k="new"] .dot { background: var(--hl); box-shadow: 0 0 0 1px rgba(0, 0, 0, .25); }
.reason[data-k="again"] .dot { background: var(--no); }
.reason[data-k="review"] .dot, .reason[data-k="focus"] .dot { background: var(--accent); }

/* ── Card stack ── */
.stage { position: relative; height: clamp(280px, calc(100vh - 380px), 470px); height: clamp(280px, calc(100dvh - 380px), 470px); perspective: 1400px; }
.stage.more::before, .stage.more::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-card); background: var(--card); box-shadow: var(--shadow-card); transform-origin: 50% 100%; }
.stage.more::before { transform: translateY(12px) scale(.92); opacity: .5; }
.stage.more::after { transform: translateY(6px) scale(.96); opacity: .8; }
.card { position: absolute; inset: 0; z-index: 2; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; border-radius: var(--r-card); outline-offset: 5px; }
.card.dragging { cursor: grabbing; }
.card.settle { transition: transform .38s cubic-bezier(.2, .9, .3, 1.25); }
.card.fly { transition: transform .3s ease-in, opacity .3s ease-in; }
.card.enter { animation: enter .28s ease-out; }
@keyframes enter { from { transform: translateY(8px) scale(.96); opacity: .5; } to { transform: none; opacity: 1; } }
.card-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3, .7, .2, 1); }
.card.flipped .card-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r-card);
  background-color: var(--card); box-shadow: var(--shadow-card); display: flex; flex-direction: column; overflow: hidden;
  background-image: linear-gradient(var(--rule-red), var(--rule-red)), repeating-linear-gradient(to bottom, transparent 0 33px, var(--rule) 33px 34px);
  background-size: 100% 2px, 100% calc(100% - 52px); background-position: 0 50px, 0 52px; background-repeat: no-repeat, no-repeat;
}
.face.back { transform: rotateY(180deg); }
.face-top { height: 50px; flex: none; position: relative; }
.hole { position: absolute; top: 17px; left: 18px; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .3); }
.tag { position: absolute; top: 13px; right: 14px; font-family: var(--font-zh); font-size: 12px; color: var(--ink-2); background: var(--card-2); border: 1px solid var(--line); padding: 1px 9px; border-radius: 999px; }
.tag.new { background: var(--hl); color: var(--hl-ink); border-color: transparent; font-family: var(--font-ui); font-weight: 600; letter-spacing: .06em; }
.tag-row { position: absolute; top: 13px; right: 14px; display: flex; gap: 6px; }
.tag-row .tag { position: static; }
.face-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; justify-content: flex-start; gap: 12px; overflow-wrap: anywhere; }
/* 內容放得下時置中；放不下時從頂端開始、可捲動（避免置中把上半部裁掉） */
.face-body > :first-child { margin-top: auto; }
.face-body > :last-child { margin-bottom: auto; }
.face-foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px 12px; }
.hint { font-size: 12px; color: var(--muted); font-family: var(--font-zh); }
.chunk { font-size: clamp(27px, 7.4vw, 38px); font-weight: 600; line-height: 1.18; letter-spacing: -.02em; text-align: center; text-wrap: balance; margin: 0; }
.ph { font-style: italic; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.zh-big { font-family: var(--font-zh); font-size: clamp(21px, 5.8vw, 27px); font-weight: 700; line-height: 1.45; text-align: center; text-wrap: balance; margin: 0; }
.cue { text-align: center; font-size: 13px; color: var(--muted); margin: 0; font-family: var(--font-zh); }
.chunk-sm { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.hw { text-decoration: underline; text-decoration-color: var(--hl); text-decoration-thickness: .16em; text-underline-offset: .16em; text-decoration-skip-ink: none; }
.headword { margin: 0; text-align: center; font-size: 15px; color: var(--ink-2); }
.headword b { font-weight: 600; color: var(--ink); }
.pos { font-style: italic; color: var(--muted); font-size: .9em; margin-left: 6px; }
.word-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 4px; margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.chunk-line { margin: 0; font-size: 16px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; padding: 8px 10px; background: var(--card-2); border-radius: 8px; }
.chunk-line b { font-weight: 600; }
.chunk-line span { font-family: var(--font-zh); color: var(--ink-2); font-size: 14px; }
.meaning { font-family: var(--font-zh); font-size: 23px; font-weight: 700; margin: -4px 0 2px; line-height: 1.35; }
.ex { font-size: 16.5px; margin: 0; line-height: 1.6; }
.sent { font-size: clamp(18px, 4.8vw, 21px); font-weight: 500; margin: 0; line-height: 1.55; }
.ex-zh { font-family: var(--font-zh); font-size: 14px; color: var(--ink-2); margin: 0; }
.tip-line { font-family: var(--font-zh); font-size: 13px; color: var(--ink-2); margin: 0; padding: 8px 10px; border-left: 3px solid var(--hl); background: var(--card-2); border-radius: 0 6px 6px 0; }
mark.hl { background: linear-gradient(transparent 50%, var(--hl) 50%, var(--hl) 92%, transparent 92%); color: inherit; padding: 0 .06em; }
.speak { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px 6px 9px; font-size: 13px; color: var(--ink-2); }
.speak .ic { width: 17px; height: 17px; }
.stamp {
  position: absolute; top: 62px; z-index: 3; display: flex; align-items: center; gap: 4px; padding: 3px 12px 3px 8px;
  border: 3px solid currentColor; border-radius: 8px; font-family: var(--font-chalk); font-size: 27px; font-weight: 700;
  letter-spacing: .1em; opacity: 0; pointer-events: none; background: var(--card);
}
.stamp .ic { width: 26px; height: 26px; stroke-width: 3; }
.stamp.yes { left: 18px; color: var(--yes); transform: rotate(-12deg); }
.stamp.no { right: 18px; color: var(--no); transform: rotate(11deg); }
.stamp.easy { left: 50%; top: 58px; color: var(--easy); transform: translateX(-50%) rotate(-4deg); }
.done {
  position: absolute; inset: 0; z-index: 2; background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow-card);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 22px; font-family: var(--font-zh);
}
.done h2 { margin: 0; font-size: 22px; }
.done p { margin: 0; color: var(--ink-2); font-size: 14px; }
.done .check { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.done .check .ic { width: 30px; height: 30px; stroke-width: 2.5; }
.done .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
.controls { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.mid { display: flex; gap: 6px; }
.mini { width: 54px; height: 54px; border-radius: var(--r-ui); border: 1px solid var(--line); background: var(--card); color: var(--ink-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-family: var(--font-zh); padding: 0; }
.mini .ic { width: 20px; height: 20px; }
.mini.easy { color: var(--easy); border-color: var(--easy); font-weight: 700; }
.mini:disabled { opacity: .38; cursor: default; }
.big-btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: var(--r-ui); font-size: 17px; font-weight: 600; font-family: var(--font-zh); border: 2px solid transparent; }
.big-btn .ic { width: 22px; height: 22px; stroke-width: 2.6; }
.big-btn.no { background: var(--card); color: var(--no); border-color: var(--no); }
.big-btn.yes { background: var(--yes); color: var(--yes-ink); }
.big-btn:disabled, .round-btn:disabled { opacity: .38; cursor: default; }
.big-btn { min-width: 0; white-space: nowrap; }
.round-btn { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink-2); display: grid; place-items: center; }
.kbd { margin: 0; text-align: center; font-size: 12px; color: var(--muted); font-family: var(--font-zh); }
.kbd kbd { font-family: var(--font-ui); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--card); color: var(--ink-2); }
@media (pointer: coarse) { .kbd { display: none; } }

/* ── Buttons & forms ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; font-family: var(--font-zh); }
.btn .ic { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--no); border-color: var(--no); }
.btn.small { padding: 6px 11px; font-size: 13px; }

/* ── Tab bar ── */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 10px; border: none; background: none; color: var(--muted); font-size: 12px; font-family: var(--font-zh); position: relative; }
.tab .ic { width: 23px; height: 23px; }
.tab[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.tab[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tab span { white-space: nowrap; }

/* ── Stats ── */
.stats { display: grid; gap: 14px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-ui); padding: 16px; min-width: 0; }
.panel-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
.panel-h h2 { font-size: 15px; margin: 0; font-weight: 700; font-family: var(--font-zh); }
.panel-h .sub { color: var(--muted); font-size: 12px; font-family: var(--font-zh); }
.panel-h .end { margin-left: auto; }
.grid2 { display: grid; gap: 14px; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.chalk {
  background: var(--board); color: var(--board-ink); border-radius: var(--r-ui); padding: 18px 20px;
  box-shadow: inset 0 0 0 5px var(--frame), inset 0 0 0 6px rgba(0, 0, 0, .25); display: grid; gap: 10px;
}
.chalk .big { font-family: var(--font-chalk); font-size: 20px; letter-spacing: .06em; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.chalk .big strong { font-size: 52px; line-height: 1; font-weight: 700; }
.chalk .msg { font-family: var(--font-chalk); font-size: 17px; line-height: 1.6; margin: 0; text-wrap: pretty; }
.chalk .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--board-dim); font-family: var(--font-zh); }
.chalk .facts b { color: var(--board-ink); font-family: var(--font-ui); font-size: 15px; margin: 0 3px; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: none; background: none; padding: 7px 16px; border-radius: 999px; font-size: 14px; color: var(--ink-2); font-family: var(--font-zh); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); font-weight: 700; }
.filter-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filter-row .note { font-size: 12px; color: var(--muted); font-family: var(--font-zh); }
.hero-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.hero-label { font-size: 13px; color: var(--ink-2); font-family: var(--font-zh); }
.hero-num { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.04em; margin-top: 4px; }
.hero-num small { font-size: 24px; font-weight: 600; margin-left: 2px; letter-spacing: 0; }
.hero-side { margin-left: auto; text-align: right; font-size: 13px; color: var(--ink-2); font-family: var(--font-zh); }
.hero-side b { font-family: var(--font-ui); color: var(--ink); font-size: 16px; }
.stack { display: flex; gap: 2px; height: 14px; }
.stack > span { height: 100%; min-width: 3px; }
.stack > span:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.stack > span:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 10px; font-family: var(--font-zh); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.legend b { font-family: var(--font-ui); color: var(--ink); font-weight: 600; }
.pace { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; font-family: var(--font-zh); color: var(--ink-2); }
.pace .ic { color: var(--accent); margin-top: 1px; }
.pace p { margin: 0; flex: 1; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-ui); padding: 12px 14px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--ink-2); font-family: var(--font-zh); }
.kpi .v { font-size: 26px; font-weight: 600; line-height: 1.2; margin-top: 3px; letter-spacing: -.02em; }
.kpi .v small { font-size: 14px; font-weight: 500; margin-left: 2px; }
.kpi .d { font-size: 12px; color: var(--muted); font-family: var(--font-zh); }
.trow { display: grid; grid-template-columns: 5.2em minmax(0, 1fr) 2.8em auto; align-items: center; gap: 10px; padding: 7px 0; }
.trow .name { font-size: 13px; font-family: var(--font-zh); display: flex; flex-direction: column; line-height: 1.25; }
.trow .name em { font-style: normal; font-size: 11px; color: var(--no); font-weight: 700; }
.trow .stack { height: 10px; }
.trow .pct { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
.go-btn { border: 1px solid var(--line); background: var(--card); border-radius: 999px; font-size: 12px; padding: 4px 11px; color: var(--accent); font-weight: 600; font-family: var(--font-zh); white-space: nowrap; }
.tough { list-style: none; margin: 0; padding: 0; }
.tough li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.tough li:first-child { border-top: 0; padding-top: 0; }
.tough .en { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.tough .zh { color: var(--ink-2); font-size: 13px; font-family: var(--font-zh); }
.tough .meta { font-size: 12px; color: var(--muted); text-align: right; grid-row: 1 / span 2; grid-column: 2; align-self: center; font-variant-numeric: tabular-nums; font-family: var(--font-zh); }
.tough .meta b { color: var(--no); font-family: var(--font-ui); font-size: 14px; }
.empty { font-size: 13px; color: var(--muted); font-family: var(--font-zh); margin: 0; }
.panel-foot { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chart-slot { width: 100%; min-height: 40px; }
.chart { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-ui); }
.chart .ax { fill: var(--muted); font-size: 11px; }
.chart .lbl { fill: var(--ink); font-size: 12px; font-weight: 600; }
.chart .lbl2 { fill: var(--ink-2); font-size: 11px; }
.chart .hit { fill: transparent; }
.chart .hit:hover + .mark, .chart .hit:focus + .mark { opacity: .8; }
.chart [tabindex]:focus { outline: none; }
.chart [tabindex]:focus-visible { outline: 2px solid var(--focus); }
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; font-family: var(--font-zh); }
.tbl th, .tbl td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { color: var(--ink-2); font-weight: 600; }
.toggle-tbl { border: 1px solid var(--line); background: var(--card); border-radius: 999px; font-size: 12px; padding: 3px 10px; color: var(--ink-2); font-family: var(--font-zh); }
.heat-sum { margin: 10px 0 0; font-size: 12px; color: var(--ink-2); font-family: var(--font-zh); }
.heat-legend { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); margin-left: auto; font-family: var(--font-zh); }
.heat-legend i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.sci p { font-family: var(--font-zh); font-size: 14px; color: var(--ink-2); margin: 0; }
.sci ol { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.sci li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-family: var(--font-zh); font-size: 14px; color: var(--ink-2); counter-increment: s; }
.sci li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-family: var(--font-ui); font-weight: 700; font-size: 12px; display: grid; place-items: center; }
.sci li b { color: var(--ink); }
.sci .refs { margin-top: 14px; font-size: 12px; color: var(--muted); }
.curve-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin: 4px 0 8px; font-family: var(--font-zh); }
.curve-legend span { display: inline-flex; align-items: center; gap: 6px; }
.curve-legend i { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
.curve-legend i.dotk { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-2); }

/* ── Sheets ── */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: minmax(0, 1fr); align-items: end; justify-items: center; background: var(--scrim); }
.sheet-panel { box-sizing: border-box; width: 100%; min-width: 0; max-width: 560px; overflow-wrap: anywhere; max-height: 88vh; overflow-y: auto; background: var(--card); border-radius: 16px 16px 0 0; padding: 16px 18px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .2); outline: none; }
@media (min-width: 700px) { .sheet { align-items: center; } .sheet-panel { border-radius: 14px; max-height: 86vh; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.sheet-head h2 { margin: 0; font-size: 18px; font-family: var(--font-zh); }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); font-family: var(--font-zh); }
.field:first-of-type { border-top: 0; }
.field .lbl { font-weight: 700; font-size: 14px; }
.field .desc { font-size: 12px; color: var(--muted); margin: 0; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { border: 1px solid var(--line); background: var(--card); padding: 6px 13px; border-radius: 999px; font-size: 13px; font-family: var(--font-zh); }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.opt:disabled { opacity: .45; cursor: default; }
.source { font-size: 12px; color: var(--muted); font-family: var(--font-zh); margin: 0; line-height: 1.6; }
.field input[type="date"] { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--card); width: max-content; max-width: 100%; }
.who { display: flex; align-items: center; gap: 12px; padding: 6px 0 12px; font-family: var(--font-zh); }
.who .av { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; background: var(--card-2); display: grid; place-items: center; color: var(--ink-2); flex: none; }
.who .av img { width: 100%; height: 100%; object-fit: cover; }
.who b { font-size: 16px; display: block; }
.who span { font-size: 13px; color: var(--ink-2); }
.note-box { font-size: 13px; color: var(--ink-2); background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0; font-family: var(--font-zh); }
.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; font-size: 13px; color: var(--ink-2); font-family: var(--font-zh); }
.steps b { color: var(--ink); }
pre.code { margin: 0; background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12px; line-height: 1.5; overflow-x: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
details.more summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--accent); padding: 4px 0; font-family: var(--font-zh); }
details.more[open] summary { margin-bottom: 10px; }
.confirm-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--no-soft); font-size: 13px; }


/* ── 字根 ── */
.roots { max-width: 680px; margin: 0 auto; display: grid; gap: 12px; min-width: 0; }
.roots-head { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.roots-head h1 { font-size: 21px; line-height: 1.2; margin: 0; font-weight: 700; }
.roots-head .sub { font-size: 13px; color: var(--muted); font-family: var(--font-zh); }
.roots-intro { margin: -4px 0 0; font-size: 13px; color: var(--ink-2); font-family: var(--font-zh); text-wrap: pretty; }
.search { position: relative; display: block; }
.search .ic { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input { box-sizing: border-box; width: 100%; height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 0 16px 0 42px; font-size: 16px; font-family: var(--font-zh); -webkit-appearance: none; appearance: none; }
.search input::placeholder { color: var(--muted); font-size: 14px; }
.chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips .opt { flex: none; display: inline-flex; gap: 5px; align-items: baseline; }
.chips .opt .n { font-size: 11px; opacity: .72; font-family: var(--font-ui); font-weight: 400; }
.list-bar { display: flex; align-items: center; gap: 2px 6px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); font-family: var(--font-zh); min-height: 28px; }
.list-bar .cnt { margin-right: auto; }
.list-bar .link-btn { display: inline-flex; align-items: center; gap: 4px; }
.list-bar .link-btn .ic, .back-btn .ic { width: 16px; height: 16px; }
.root-list { display: grid; gap: 10px; min-width: 0; }
.root-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-ui); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.root-top { display: flex; align-items: flex-start; gap: 12px; }
.root-title { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; }
.root-key { font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; overflow-wrap: anywhere; }
.root-mean { font-family: var(--font-zh); font-size: 15px; font-weight: 700; color: var(--accent); }
.root-mean i { font-family: var(--font-ui); font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.root-prog { flex: none; width: 88px; display: grid; gap: 5px; font-size: 12px; color: var(--muted); text-align: right; font-family: var(--font-zh); padding-top: 5px; }
.root-prog b { color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
.root-prog .stack { height: 6px; }
.root-eg { margin: 0; font-family: var(--font-zh); font-size: 14px; line-height: 1.65; padding: 8px 11px; background: var(--card-2); border-radius: 8px; color: var(--ink-2); overflow-wrap: anywhere; }
.root-src { display: block; font-size: 12px; color: var(--muted); }
b.rt { font-weight: 700; color: var(--accent); text-decoration: underline; text-decoration-color: var(--hl); text-decoration-thickness: .14em; text-underline-offset: .18em; text-decoration-skip-ink: none; }
.wchips { display: flex; flex-wrap: wrap; gap: 6px; }
.wchip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px 3px 9px; font-size: 14.5px; line-height: 1.4; background: var(--card); overflow-wrap: anywhere; min-width: 0; }
.wchip::before, .lvdot { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--viz-track); box-shadow: inset 0 0 0 1px var(--axis); flex: none; }
.wchip[data-lv="weak"]::before, .lvdot[data-lv="weak"] { background: var(--viz-weak); box-shadow: none; }
.wchip[data-lv="ok"]::before, .lvdot[data-lv="ok"] { background: var(--viz-ok); box-shadow: none; }
.wchip[data-lv="master"]::before, .lvdot[data-lv="master"] { background: var(--viz-master); box-shadow: none; }
.wchip.hit { background: var(--hl); color: var(--hl-ink); border-color: transparent; }
.wchip.hit b.rt { color: inherit; }
.rwords { list-style: none; margin: 0; padding: 0; }
.rwords li { padding: 9px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 6px; align-items: center; min-width: 0; }
.rwords li > div { grid-column: 1; }
.rwords li:first-child { border-top: 0; padding-top: 0; }
.rwords li.hit { box-shadow: inset 3px 0 0 var(--hl); padding-left: 10px; }
.rw-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; min-width: 0; }
.rw-top .lvdot { align-self: center; }
.rw-w { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.rw-top .pos { margin-left: -2px; }
.rw-zh { font-family: var(--font-zh); font-size: 14px; color: var(--ink-2); flex: 1 1 8em; min-width: 0; }
.rw-lv { font-size: 11px; color: var(--muted); font-family: var(--font-zh); white-space: nowrap; }
.rw-chunk { display: flex; align-items: center; flex-wrap: wrap; gap: 0 10px; padding-left: 15px; min-width: 0; }
.rw-chunk .en { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.rw-chunk .zh { font-family: var(--font-zh); font-size: 13px; color: var(--ink-2); flex: 1 1 auto; min-width: 0; }
.say-mini { grid-column: 2; grid-row: 1 / span 2; border: none; background: none; color: var(--muted); width: 36px; height: 36px; margin-right: -6px; display: grid; place-items: center; border-radius: 50%; }
.say-mini .ic { width: 18px; height: 18px; }
.root-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.ic.flip { transform: rotate(180deg); }
.empty-big { text-align: center; color: var(--muted); font-family: var(--font-zh); font-size: 14px; padding: 30px 10px; margin: 0; }
.code-inline { font-family: var(--font-ui); letter-spacing: .08em; }

/* ── MP3 面板 ── */
.code-row { display: flex; gap: 8px; }
.code-row input { box-sizing: border-box; flex: 1; width: 0; min-width: 0; height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 0 12px; font-family: var(--font-ui); font-size: 22px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; text-align: center; }
.code-row input::placeholder { font-size: 15px; letter-spacing: .04em; font-weight: 400; color: var(--muted); text-transform: none; }
.code-row .btn { flex: none; }
.code-err { margin: 0; font-size: 13px; color: var(--no); }
.src-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.src-btn { display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; font-family: var(--font-zh); min-width: 0; }
.src-btn b { font-size: 14px; }
.src-btn span { font-size: 12px; color: var(--muted); }
.src-btn:not(:disabled):hover { border-color: var(--accent); }
.src-btn:disabled { opacity: .5; cursor: default; }
.set-list { list-style: none; margin: 0; padding: 0; }
.set-list li { display: flex; align-items: center; gap: 6px; padding: 9px 0; border-top: 1px solid var(--line); }
.set-list li:first-child { border-top: 0; }
.set-list .grow { flex: 1; min-width: 0; display: grid; }
.set-list .grow span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.code-sm { font-family: var(--font-ui); font-size: 16px; letter-spacing: .12em; }
.mp3-box { display: grid; gap: 12px; font-family: var(--font-zh); padding-top: 4px; }
.code-card { display: grid; justify-items: center; gap: 2px; padding: 14px 16px 16px; border-radius: var(--r-ui); background: var(--board); color: var(--board-ink); box-shadow: inset 0 0 0 4px var(--frame), inset 0 0 0 5px rgba(0, 0, 0, .25); text-align: center; }
.code-card .lbl { font-size: 12px; color: var(--board-dim); letter-spacing: .3em; }
.code-big { font-family: var(--font-chalk); font-size: 46px; line-height: 1.1; font-weight: 700; letter-spacing: .2em; margin-right: -.2em; }
.code-card .set-name { font-size: 13px; color: var(--board-dim); }
.set-name { margin: 0; font-size: 14px; font-weight: 700; }
.mp3-box audio { width: 100%; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pbar.big { height: 10px; border-radius: 5px; }
.pbar.big i { border-radius: 5px; }
.mp3-box .desc { font-size: 12px; color: var(--muted); margin: 0; }
.set-items { margin: 0; padding-left: 1.8em; display: grid; gap: 5px; font-size: 13px; }

.","英文字母有二十六個。"],["amaze(ment)","v./(n.)","使驚奇；（amazement）驚奇","in amazement","驚訝地","We watched the fireworks *in amazement*.","我們驚嘆地看著煙火。"],["ambassador","n.","大使","the ambassador to","駐…大使","He was appointed *the ambassador to* Japan.","他被任命為駐日大使。"],["ambition","n.","抱負；野心","have an ambition to V","有做…的抱負","She *has an ambition to* become a lawyer.","她立志成為律師。"],["ambulance","n.","救護車","call an ambulance","叫救護車","Someone fainted, so we *called an ambulance*.","有人昏倒了，所以我們叫了救護車。"],["angel","n.","天使","a guardian angel","守護天使","My grandma is like *a guardian angel* to me.","奶奶對我來說就像守護天使。"],["announce(ment)","v./(n.)","宣布；（announcement）公告","make an announcement","發布公告","The principal will *make an announcement* at noon.","校長中午會發布公告。"],["anxious","adj.","焦慮的；渴望的","be anxious about","為…焦慮","She *is anxious about* the test results.","她為考試結果感到焦慮。"],["anyhow","adv.","無論如何；隨便地","anyhow","不管怎樣","It's raining, but I'll go *anyhow*.","雖然在下雨，我還是會去。"],["apart","adv.","分開地；相距","fall apart","崩潰；瓦解","The old chair *fell apart* when I sat on it.","我一坐下，那張舊椅子就散了。"],["apologize","v.","道歉","apologize to sb for sth","為某事向某人道歉","I *apologized to her for* my rude words.","我為我無禮的話向她道歉。"],["appeal","n./v.","吸引；呼籲；上訴","appeal to","吸引…；向…呼籲","The game *appeals to* teenagers.","這款遊戲吸引青少年。"],["approve","v.","贊成；批准","approve of","贊成…","My parents don't *approve of* my plan.","我爸媽不贊成我的計畫。"],["apron","n.","圍裙","wear an apron","穿圍裙","The chef *wore an apron* while cooking.","廚師做菜時穿著圍裙。"],["armed","adj.","武裝的","armed forces","武裝部隊；軍隊","He served in the *armed forces* for two years.","他在軍中服役兩年。"],["arrest","n./v.","逮捕","be under arrest","被逮捕","\"You *are under arrest*,\" said the police officer.","警察說：「你被逮捕了。」"],["ash","n.","灰","burn to ashes","燒成灰燼","The house was *burned to ashes*.","那棟房子被燒成灰燼。"],["aside","adv.","在旁邊；撇開","aside from","除了…之外","*Aside from* the price, it's a great phone.","除了價格之外，這是一支很棒的手機。"],["assist","v.","協助","assist sb in V-ing","協助某人做…","Volunteers *assisted us in cleaning* the beach.","志工協助我們清理海灘。"],["assistant","n.","助理","a teaching assistant","助教","She works as *a teaching assistant* at the university.","她在大學擔任助教。"],["assume","v.","假定；承擔","assume that","認定…","Don't *assume that* everyone agrees with you.","別以為每個人都同意你。"],["athlete","n.","運動員","a professional athlete","職業運動員","He wants to be *a professional athlete*.","他想成為職業運動員。"],["attitude","n.","態度","attitude toward","對…的態度","What is your *attitude toward* social media?","你對社群媒體的態度是什麼？"],["attract","v.","吸引","attract attention","吸引注意","The bright colors *attract attention*.","鮮豔的顏色吸引注意。"],["attractive","adj.","有吸引力的","an attractive offer","誘人的條件","The company made him *an attractive offer*.","那家公司開給他很誘人的條件。"],["audience","n.","觀眾；聽眾","a large audience","眾多觀眾","The show attracted *a large audience*.","這場表演吸引了眾多觀眾。"],["automatic","adj.","自動的","automatic doors","自動門","*Automatic doors* opened as we walked in.","我們走進去時自動門打開了。"],["automobile/auto","n.","汽車","the automobile industry","汽車工業","*The automobile industry* is changing to electric cars.","汽車工業正轉向電動車。"],["avenue","n.","大道；途徑","a tree-lined avenue","林蔭大道","We walked along *a tree-lined avenue*.","我們沿著林蔭大道散步。"],["awake","adj./v.","醒著的；喚醒","stay awake","保持清醒","I drank coffee to *stay awake*.","我喝咖啡來保持清醒。"],["awaken","v.","喚醒；覺醒","awaken interest","喚起興趣","The trip *awakened my interest* in history.","這趟旅行喚起了我對歷史的興趣。"],["award","n./v.","獎；授予","win an award","得獎","The film *won an award* at the festival.","這部電影在影展上得獎。"],["aware","adj.","知道的；意識到的","be aware of","意識到…","*Be aware of* the dangers of the sea.","要意識到大海的危險。"],["awful","adj.","可怕的；糟糕的","feel awful","感覺很糟","I *felt awful* about forgetting her birthday.","忘記她的生日讓我覺得很過意不去。"],["awkward","adj.","尷尬的；笨拙的","an awkward silence","尷尬的沉默","There was *an awkward silence* after his joke.","他講完笑話後出現一陣尷尬的沉默。"],["background","n.","背景","family background","家庭背景","Students come from different *family backgrounds*.","學生們來自不同的家庭背景。"],["bacon","n.","培根","bacon and eggs","培根蛋","I had *bacon and eggs* for breakfast.","我早餐吃了培根蛋。"],["bacteria","n.","細菌","harmful bacteria","有害細菌","Washing hands removes *harmful bacteria*.","洗手可以去除有害細菌。"],["badly","adv.","嚴重地；很差地","badly hurt","傷得很重","He was *badly hurt* in the accident.","他在車禍中受了重傷。"],["baggage","n.","行李","check in baggage","託運行李","We *checked in our baggage* at the airport.","我們在機場託運行李。"],["bait","n./v.","誘餌；引誘","take the bait","上鉤；中圈套","Don't *take the bait*; it's a scam.","別上鉤，那是詐騙。"],["bamboo","n.","竹子","bamboo shoots","竹筍","*Bamboo shoots* are delicious in summer.","夏天的竹筍很好吃。"],["bang","n./v./adv.","重擊；砰的一聲","bang on the door","用力敲門","Someone *banged on the door* at midnight.","有人半夜用力敲門。"],["banker","n.","銀行家","an investment banker","投資銀行家","Her father is *an investment banker*.","她父親是投資銀行家。"],["bare","adj./v.","赤裸的；光禿的","with bare hands","赤手空拳","He caught the fish *with his bare hands*.","他徒手抓到了那條魚。"],["barely","adv.","幾乎沒有；僅僅","barely enough","勉強夠","We had *barely enough* money for the tickets.","我們的錢勉強夠買票。"],["barn","n.","穀倉","an old barn","舊穀倉","The farmer keeps his tools in *an old barn*.","農夫把工具放在一間舊穀倉裡。"],["barrel","n.","桶","a barrel of oil","一桶石油","The price of *a barrel of oil* went up.","一桶石油的價格上漲了。"],["basement","n.","地下室","in the basement","在地下室","We store old things *in the basement*.","我們把舊東西放在地下室。"],["bay","n.","海灣","a quiet bay","寧靜的海灣","The boat stopped in *a quiet bay*.","船停在一處寧靜的海灣。"],["bead","n.","珠子","a string of beads","一串珠子","She wore *a string of beads* around her neck.","她脖子上戴著一串珠子。"],["beam","n./v.","光束；橫樑；笑容滿面","a beam of light","一道光束","*A beam of light* came through the window.","一道光從窗戶照進來。"],["beast","n.","野獸","a beast of burden","馱獸","In the past, oxen were used as *beasts of burden*.","過去牛被用來當馱獸。"],["beetle","n.","甲蟲","a black beetle","黑色甲蟲","*A black beetle* crawled across the floor.","一隻黑色甲蟲爬過地板。"],["beneath","prep.","在…之下","beneath the surface","在表面之下","Many problems lie *beneath the surface*.","許多問題隱藏在表面之下。"],["benefit","n./v.","利益；對…有益","benefit from","從…中獲益","Students *benefit from* reading every day.","學生能從每天閱讀中獲益。"],["berry","n.","莓果","fresh berries","新鮮莓果","She added *fresh berries* to her yogurt.","她在優格裡加了新鮮莓果。"],["besides","adv./prep.","此外；除了…之外還","besides that","除此之外","*Besides that*, the hotel was very clean.","除此之外，飯店也很乾淨。"],["bet","v./n.","打賭；敢說","I bet","我敢說","*I bet* you can't finish that whole pizza.","我敢說你吃不完整個披薩。"],["bind","v.","綁；約束","be bound to V","一定會…","If you keep practicing, you *are bound to* improve.","只要持續練習，你一定會進步。"],["bitter","adj.","苦的；痛苦的","a bitter lesson","慘痛的教訓","Failing the exam taught him *a bitter lesson*.","考試失敗給了他一個慘痛的教訓。"],["bleed","v.","流血","bleed heavily","大量出血","The cut on his leg *bled heavily*.","他腿上的傷口大量出血。"],["bless","v.","祝福","bless you","保佑你（打噴嚏時說）","\"Achoo!\" \"*Bless you*!\"","「哈啾！」「保重！」"],["bloody","adj.","流血的；血腥的","a bloody nose","流鼻血","He got *a bloody nose* during the game.","他在比賽中流了鼻血。"],["blouse","n.","女用上衣","a white blouse","白色上衣","Girls wear *a white blouse* with the uniform.","女生制服是白色上衣。"],["bold","adj.","大膽的；粗體的","a bold decision","大膽的決定","Quitting his job was *a bold decision*.","辭職是一個大膽的決定。"],["bomb","n./v.","炸彈；轟炸","a time bomb","定時炸彈","The old building is *a time bomb*.","那棟老建築就像一顆定時炸彈。"],["bookcase","n.","書櫃","a wooden bookcase","木製書櫃","*A wooden bookcase* stands in the corner.","角落放著一個木製書櫃。"],["boot","n./v.","靴子；開機","a pair of boots","一雙靴子","I bought *a pair of boots* for winter.","我買了一雙冬天穿的靴子。"],["bore","v./n.","使厭煩；無聊的人","bore sb to death","讓某人無聊得要命","The long speech *bored me to death*.","那場冗長的演講讓我無聊得要命。"],["bowling","n.","保齡球","go bowling","去打保齡球","We *went bowling* after the exam.","考完試後我們去打保齡球。"],["brake","n./v.","煞車","hit the brakes","踩煞車","The driver *hit the brakes* just in time.","司機及時踩了煞車。"],["brass","n./adj.","黃銅；銅管樂器","a brass band","銅管樂隊","*A brass band* played at the parade.","遊行中有一支銅管樂隊演奏。"],["bravery","n.","勇敢","an award for bravery","英勇獎","The firefighter received *an award for bravery*.","那位消防員獲頒英勇獎。"],["breast","n.","胸部；乳房","breast cancer","乳癌","Early checks can find *breast cancer* in time.","及早檢查能及時發現乳癌。"],["breath","n.","呼吸；氣息","out of breath","上氣不接下氣","I was *out of breath* after climbing the stairs.","爬完樓梯我上氣不接下氣。"],["breathe","v.","呼吸","breathe deeply","深呼吸","*Breathe deeply* and try to relax.","深呼吸，試著放鬆。"],["breeze","n./v.","微風","a cool breeze","涼爽的微風","*A cool breeze* came in from the sea.","一陣涼爽的微風從海上吹來。"],["brick","n.","磚","a brick wall","磚牆","The old house has *a red brick wall*.","那棟老房子有一面紅磚牆。"],["bride","n.","新娘","the bride and groom","新娘和新郎","Everyone clapped for *the bride and groom*.","大家為新娘新郎鼓掌。"],["broadcast","n./v.","廣播；播送","broadcast live","現場直播","The game will be *broadcast live* on TV.","這場比賽將在電視上現場直播。"],["brunch","n.","早午餐","have brunch","吃早午餐","We *had brunch* at a café on Sunday.","星期天我們在一家咖啡廳吃早午餐。"],["bubble","n./v.","泡泡；冒泡","blow bubbles","吹泡泡","The kids *blew bubbles* in the park.","孩子們在公園吹泡泡。"],["bucket","n.","桶","a bucket of water","一桶水","He carried *a bucket of water* to the garden.","他提了一桶水到花園。"],["bud","n./v.","芽；花苞","in bud","含苞待放","The roses are *in bud*.","玫瑰含苞待放。"],["budget","n./v.","預算；編預算","on a budget","預算有限","We traveled Japan *on a budget*.","我們以有限的預算遊日本。"],["buffalo","n.","水牛","a water buffalo","水牛","*A water buffalo* was working in the rice field.","一頭水牛在稻田裡工作。"],["buffet","n.","自助餐","an all-you-can-eat buffet","吃到飽自助餐","We went to *an all-you-can-eat buffet*.","我們去吃了吃到飽自助餐。"],["bulb","n.","燈泡；球莖","a light bulb","燈泡","The *light bulb* in my room burned out.","我房間的燈泡燒壞了。"],["bull","n.","公牛","take the bull by the horns","勇敢面對難題","It's time to *take the bull by the horns* and talk to him.","是時候鼓起勇氣去跟他談了。"],["bullet","n.","子彈","bullet train","子彈列車；高鐵","We took the *bullet train* to Tokyo.","我們搭新幹線去東京。"],["bump","n./v.","撞；腫塊","bump into","撞到；巧遇","I *bumped into* my teacher at the night market.","我在夜市巧遇老師。"],["bunch","n.","串；束；群","a bunch of","一串；一群","*A bunch of* kids were playing outside.","一群孩子在外面玩。"],["bundle","n.","捆；包","a bundle of","一捆…","He carried *a bundle of* old newspapers.","他扛著一捆舊報紙。"],["bury","v.","埋葬；埋","be buried in","埋首於…","She *was buried in* her books all weekend.","她整個週末都埋首書堆。"],["bush","n.","灌木叢","beat around the bush","拐彎抹角","Stop *beating around the bush* and tell me the truth.","別拐彎抹角了，告訴我實話。"],["buzz","n./v.","嗡嗡聲；發出嗡嗡聲","buzz around","嗡嗡地飛來飛去","A fly was *buzzing around* the kitchen.","一隻蒼蠅在廚房裡嗡嗡地飛來飛去。"],["cabin","n.","小屋；船艙；機艙","a log cabin","小木屋","We stayed in *a log cabin* in the mountains.","我們住在山上的小木屋。"],["cable","n./v.","電纜；有線電視","a charging cable","充電線","I forgot my phone's *charging cable*.","我忘了帶手機的充電線。"],["cafeteria","n.","自助餐廳；學生餐廳","the school cafeteria","學生餐廳","We eat lunch in *the school cafeteria*.","我們在學生餐廳吃午餐。"],["campus","n.","校園","on campus","在校園裡","Many students live *on campus*.","許多學生住在校園裡。"],["canyon","n.","峽谷","the Grand Canyon","大峽谷","We visited *the Grand Canyon* in Arizona.","我們去亞利桑那州參觀大峽谷。"],["capable","adj.","有能力的","be capable of","有能力做…","She *is capable of* leading the team.","她有能力帶領團隊。"],["captain","n.","隊長；船長；機長","the team captain","隊長","He was chosen as *the team captain*.","他被選為隊長。"],["capture","v./n.","捕捉；奪取","capture the moment","捕捉瞬間","The photo *captured the moment* perfectly.","這張照片完美捕捉了那一刻。"],["career","n.","職業；生涯","a career in","從事…的職業","She wants *a career in* medicine.","她想從事醫學工作。"],["carpenter","n.","木匠","a skilled carpenter","熟練的木匠","*A skilled carpenter* made this table.","這張桌子是一位熟練的木匠做的。"],["carpet","n./v.","地毯","roll out the red carpet","隆重歡迎","The city *rolled out the red carpet* for the team.","這座城市隆重歡迎這支隊伍。"],["carriage","n.","馬車；車廂","a horse-drawn carriage","馬車","They rode in *a horse-drawn carriage*.","他們搭了一輛馬車。"],["cart","n./v.","手推車","a shopping cart","購物車","She pushed *a shopping cart* around the supermarket.","她推著購物車在超市裡逛。"],["cast","v./n.","投；演員陣容；石膏","a cast on one's arm","手臂打石膏","He has *a cast on his arm* after the fall.","他跌倒後手臂打上石膏。"],["casual","adj.","休閒的；隨意的","casual clothes","便服","You can wear *casual clothes* on Fridays.","星期五可以穿便服。"],["cattle ical problem","數學問題","He solved *the mathematical problem* in minutes.","他幾分鐘就解出了那道數學題。"],["mayor","n.","市長","be elected mayor","當選市長","She *was elected mayor* last year.","她去年當選市長。"],["meadow","n.","草地；牧草地","a green meadow","一片綠色草地","Cows were eating grass in *a green meadow*.","牛群在一片綠色草地上吃草。"],["meaningful","adj.","有意義的","a meaningful experience","有意義的經驗","Volunteering was *a meaningful experience* for me.","當志工對我來說是很有意義的經驗。"],["meanwhile","n./adv.","同時；在此期間","in the meanwhile","在此同時","I'll cook dinner. *In the meanwhile*, you can do your homework.","我來煮晚餐，你可以同時寫功課。"],["medal","n.","獎牌","win a medal","贏得獎牌","Taiwan *won two medals* in badminton.","台灣在羽球項目贏得兩面獎牌。"],["medium/media","n.","媒介；（media）媒體","social media","社群媒體","Many teens get news from *social media*.","很多青少年從社群媒體獲得新聞。"],["melon","n.","瓜；甜瓜","a slice of melon","一片哈密瓜","Would you like *a slice of melon*?","你要來一片哈密瓜嗎？"],["melt","v.","融化","melt away","融化；逐漸消失","The snow *melted away* in the sun.","雪在陽光下融化了。"],["mend","v.","修補；修理","mend a relationship","修補關係","He tried to *mend his relationship* with his father.","他試著修補和父親的關係。"],["mental","adj.","心理的；精神的","mental health","心理健康","Exercise is good for your *mental health*.","運動對心理健康有益。"],["merry","adj.","歡樂的","Merry Christmas","聖誕快樂","*Merry Christmas* and Happy New Year!","聖誕快樂，新年快樂！"],["mess","n./v.","雜亂；混亂","make a mess","弄得一團亂","The kids *made a mess* in the kitchen.","孩子們把廚房弄得一團亂。"],["microphone/mike","n.","麥克風","speak into the microphone","對著麥克風說話","Please *speak into the microphone*.","請對著麥克風說話。"],["microwave","n./v.","微波爐；用微波爐加熱","heat sth up in the microwave","用微波爐加熱","Just *heat it up in the microwave* for two minutes.","只要用微波爐加熱兩分鐘就好。"],["mighty","adj.","強大的；巨大的","a mighty army","強大的軍隊","The king led *a mighty army*.","國王率領一支強大的軍隊。"],["minus","prep./n./adj.","減；負的；零下","minus ten degrees","零下十度","It was *minus ten degrees* in Harbin.","哈爾濱當時是零下十度。"],["miracle","n.","奇蹟","it's a miracle that","…真是奇蹟","*It's a miracle that* no one was hurt.","沒有人受傷真是奇 er a microscope","在顯微鏡下","We looked at the cells *under a microscope*.","我們在顯微鏡下觀察細胞。"],["mild","adj.","溫和的；輕微的","a mild climate","溫和的氣候","Taiwan has *a mild climate* in winter.","台灣冬天氣候溫和。"],["mill","n./v.","磨坊；工廠","a paper mill","造紙廠","The town grew up around *a paper mill*.","這座小鎮是圍繞著一家造紙廠發展起來的。"],["millionaire","n.","百萬富翁","become a millionaire","成為百萬富翁","He *became a millionaire* at thirty.","他三十歲就成了百萬富翁。"],["miner","n.","礦工","a coal miner","煤礦工","His grandfather was *a coal miner*.","他祖父是一名煤礦工人。"],["mineral","n.","礦物；礦物質","mineral water","礦泉水","I'd like a bottle of *mineral water*.","我想要一瓶礦泉水。"],["minimum","adj./n.","最小的；最低限度","a minimum of","至少…","You need *a minimum of* 60 points to pass.","你至少需要六十分才能及格。"],["minister","n.","部長；牧師","the Minister of Education","教育部長","*The Minister of Education* visited our school.","教育部長參訪了我們學校。"],["ministry","n.","（政府的）部；神職","the Ministry of Education","教育部","*The Ministry of Education* announced a new policy.","教育部宣布了一項新政策。"],["mischief","n.","惡作劇；調皮","get into mischief","調皮搗蛋","The boys often *get into mischief*.","那些男孩常常調皮搗蛋。"],["miserable","adj.","悲慘的；痛苦的","feel miserable","覺得很難受","I *felt miserable* when I had the flu.","我得流感時覺得很難受。"],["misfortune","n.","不幸","have the misfortune to","不幸…","He *had the misfortune to* lose his wallet on the trip.","他很不幸在旅途中弄丟了錢包。"],["mislead","v.","誤導","be misleading","有誤導性的","The ad *is misleading*.","這則廣告有誤導性。"],["misunderstand","v.","誤解","Don't misunderstand me.","別誤會我","*Don't misunderstand me*; I'm not angry.","別誤會，我沒有生氣。"],["moderate","adj.","適度的；溫和的","moderate exercise","適度的運動","*Moderate exercise* is good for your health.","適度運動對健康有益。"],["modest","adj.","謙虛的；適度的","be modest about","對…很謙虛","She *is modest about* her success.","她對自己的成功很謙虛。"],["modesty","n.","謙虛","with modesty","謙虛地","He accepted the award *with modesty*.","他謙虛地接受了獎項。"],["monitor","n./v.","監視器；監控","monitor one's progress","追蹤自己的進度","This app helps you *monitor your progress*.","這個應用程式幫你追蹤自己的進度。"],["monument","n.","紀念 /* ═════════ 6. 學習排程（下一張要出哪張？） ═════════ */
function newSess(filter) { return { filter: filter || 'all', cur: null, flipped: false, lastId: null, lastAt: 0, sinceNew: 0, extraNew: 0, focus: null }; }

}
function newScope(deck, f) {

}
function queueInfo(deck) {

  const learnDue = [], learnWait = [], reviews = [];

    const p = S.cards[c.id];

    else if (p.due <= now) reviews.push(c);
  }
  const due = c => S.cards[c.id].due;

  learnWait.sort((a, b) => due(a) - due(b));

  reviews.sort((a, b) => R.get(a.id) - R.get(b.id));
  let newCount = 0, firstNew = null;
  for (const c of newScope(deck, ss.filter)) { const p = S.cards[c.id]; if (!p || !p.st) { newCount++; if (!firstNew) firstNew = c; } }
  const newLeft = Math.max(0, newLimit(deck) - (todayDay(deck).nw || 0));

}

  const q = queueInfo(deck);

  const ld = notLast(q.learnDue);
  if (ld.length) return { card: ld[0], kind: 'again' };

  if (q.newAvail > 0 && (q.reviews.length === 0 || ss.sinceNew >= mixN)) return { card: q.firstNew, kind: 'new' };
  if (q.reviews.length) return { card: q.reviews[0], kind: 'review' };
  const lw = notLast(q.learnWait);
  if (lw.length) return { card: lw[0], kind: 'again' };

}
function reasonFor(deck, cur) {

  if (cur.kind === 'new' || !p || !p.st) {

/* ── 滑動手勢 ── */
function bindCard(el, deck) {
  let pid = null, sx = 0, sy = 0, dx = 0, dy = 0, t0 = 0, dragging = false;
  el.addEventListener('pointerdown', e => {
    if (busy || (e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('button')) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0; t0 = performance.now(); dragging = false;
    el.classList.remove('settle');
  });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== pid) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (!dragging) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        dragging = true; el.classList.add('dragging');
        try { el.setPointerCapture(pid); } catch (err) { /* ignore */ }
      } else if (Math.abs(dy) > 12) { pid = null; return; } else return;
    }
    e.preventDefault();
    el.style.transform = `translate(${dx}px, ${dy * 0.2}px) rotate(${dx * 0.045}deg)`;
    const a = Math.min(1, Math.abs(dx) / 110);
    el.querySelector('.stamp.yes').style.opacity = dx > 0 ? a : 0;
    el.querySelector('.stamp.no').style.opacity = dx < 0 ? a : 0;
  });
  const end = e => {
    if (e.pointerId !== pid) return;
    pid = null;
    el.classList.remove('dragging');
    if (!dragging) {
      if (e.type === 'pointerup' && Math.hypot(dx, dy) < 8) flip(deck);
      return;
    }
    dragging = false;
    const v = Math.abs(dx) / Math.max(1, performance.now() - t0);
    if (e.type === 'pointerup' && (Math.abs(dx) > 105 || (Math.abs(dx) > 45 && v > 0.55))) commit(deck, dx > 0 ? 3 : 1, dy);
    else { el.classList.add('settle'); el.style.transform = ''; el.querySelectorAll('.stamp').forEach(s => { s.style.opacity = 0; }); }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === el) { e.preventDefault(); flip(deck); } });
}
function flip(deck) {
  const ss = SESS[deck], el = $('#card');

  ss.flipped = !ss.flipped;
  el.classList.toggle('flipped', ss.flipped);
  el.querySelector('.front').setAttribute('aria-hidden', String(ss.flipped));
  el.querySelector('.back').setAttribute('aria-hidden', String(!ss.flipped));
  const f = cardFaces(deck, ss.cur.card);
  el.setAttribute('aria-label', ss.flipped ? f.label : f.frontLabel);
  $('#live').textContent = ss.flipped ? f.label : f.frontLabel;

}
function commit(deck, g, dy = 0) {
  const el = $('#card');
  if (!el || busy || !SESS[deck].cur) return;
  busy = true;
  const stamp = g === 4 ? '.stamp.easy' : g > 1 ? '.stamp.yes' : '.stamp.no';
  el.querySelector(stamp).style.opacity = 1;
  el.classList.remove('settle', 'dragging');
  if (reduceMotion()) { busy = false; answer(deck, g); return; }
  const w = Math.max(window.innerWidth, 640), h = Math.max(window.innerHeight, 700);
  const go = () => {
    el.classList.add('fly');
    el.style.transform = g === 4 ? `translate(0, ${-h}px) rotate(-3deg)` : `translate(${(g > 1 ? 1 : -1) * w}px, ${dy * 0.2 + 30}px) rotate(${(g > 1 ? 1 : -1) * 24}deg)`;
    el.style.opacity = '0';
  };
  requestAnimationFrame(() => requestAnimationFrame(go));
  setTimeout(() => { busy = false; answer(deck, g); }, 300);

  else if (act === 'mp3-part') { const p = MP.parts && MP.parts[+a.dataset.i]; if (p) openMp3Set(p.ids, p.n, 'list'); }
  else if (act === 'mp3-retry') { if (MP.set) buildMp3(MP.set.code); }
  else if (act === 'mp3-save') saveMp3();
  else if (act === 'mp3-review') reviewSet(a.dataset.code);
  else if (act === 'mp3-make') buildMp3(a.dataset.code);
  else if (act === 'more-new') { const d = studyDeck(), ss = SESS[d], q = queueInfo(d); ss.extraNew += Math.min(10, q.newCount) + Math.max(0, (todayDay(d).nw || 0) - newLimit(d)); ss.sinceNew = 99; ss.cur = null; renderStudy(true); }
  else if (act === 'filter-all') { const d = studyDeck(); SESS[d].filter = 'all'; SESS[d].cur = null; renderStudy(true); }
  else if (act === 'toggle-table') { tables[a.dataset.t] = !tables[a.dataset.t]; renderStats(); }
  else if (act === 'open-settings') openSheet('sheet-settings');
  else if (act === 'login') googleSignIn();
  else if (act === 'logout') googleSignOut();
  else if (act === 'hide-login') { lsSet(STORE_KEY + ':hide-login', '1'); renderBanners(); fitStage(); }
  else if (act === 'hide-intro') { lsSet(STORE_KEY + ':intro', '2'); renderBanners(); fitStage(); }
  else if (act === 'export') exportProgress();
  else if (act === 'import') $('#import-file').click();
  else if (act === 'reset') { confirmReset = true; renderSettings(); }
  else if (act === 'reset-no') { confirmReset = false; renderSettings(); }
  else if (act === 'reset-yes') {
    confirmReset = false;
    const keep = S.settings, keepSets = S.sets; S = defaultState(); S.settings = keep; S.sets = keepSets; rebuildVocabOrder();
    for (const k of Object.keys(SESS)) SESS[k] = newSess();
    undoStack = null;
    S.updatedAt = Date.now(); saveLocal(Sync.uid, S);
    if (Sync.write && !Sync.readonly) { markAllDirty(); flush(); }
    renderSettings(); refreshAfterDataChange(true); toast('已清除所有學習紀錄');
  } else if (act === 'copy-rules') {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(RULES).then(() => toast('已複製安全規則'), () => selectRules());
    else selectRules();
  }
});
function selectRules() { const el = $('#rules-code'); if (!el) return; const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('已選取，請按複製'); }
$('#import-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importProgress(f); e.target.value = ''; });
$('#settings-btn').addEventListener('click', () => openSheet('sheet-settings'));
$('#acct-btn').addEventListener('click', () => openSheet('sheet-account'));
$('#mp3-btn').addEventListener('click', () => { if (MP.mode !== 'build' && MP.mode !== 'ready') MP.mode = 'home'; openSheet('sheet-mp3'); });
$('#why-btn').addEventListener('click', () => { switchView('stats'); setTimeout(() => { const el = $('#science'); if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }); }, 30); });
$('#btn-no').addEventListener('click', () => commit(studyDeck(), 1));
$('#btn-yes').addEventListener('click', () => commit(studyDeck(), 3));
$('#btn-easy').addEventListener('click', () => commit(studyDeck(), 4));
$('#btn-undo').addEventListener('click', undo);
$('#filter').addEventListener('change', e => { const ss = SESS[studyDeck()]; ss.filter = e.target.value; ss.cur = null; renderStudy(true); });
document.addEventListener('change', e => {
  if (e.target.id === 'set-exam' && parseIdx(e.target.value) !== null) { S.settings.exam = e.target.value; markDirty(null, true); renderCountdown(); if (view === 'stats') renderStats(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.querySelector('.sheet:not([hidden])')) { closeSheets(); return; }
  if (e.defaultPrevented || (view !== 'vocab' && view !== 'write') || document.querySelector('.sheet:not([hidden])')) return;
  if (e.target.closest && e.target.closest('input, select, textarea, [contenteditable]')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) { if ((e.key === 'z' || e.key === 'Z') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undo(); } return; }
  const d = studyDeck();
  if (e.key === 'ArrowLeft') { e.preventDefault(); commit(d, 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); commit(d, 3); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); commit(d, 4); }
  else if ((e.key === ' ' || e.key === 'Enter') && !e.target.closest('button, a')) { e.preventDefault(); flip(d); }
  else if (e.key === 'z' || e.key === 'Z') undo();
  else if (e.key === 's' || e.key === 'S') { const b = document.querySelector('#card ' + (SESS[d].flipped ? '.back' : '.front') + ' [data-say]'); if (b) speak(b.dataset.say); }
});
/* 圖表提示框 */
const tipEl = $('#tip');
function showTip(el) {
  const txt = el.getAttribute('data-tip'); if (!txt) return;
  tipEl.textContent = txt; tipEl.classList.add('show');
  const r = el.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  const x = clamp(r.left + r.width / 2 - tw / 2, 8, window.innerWidth - tw - 8), y = r.top - th - 8;
  tipEl.style.left = x + 'px'; tipEl.style.top = (y < 8 ? r.bottom + 8 : y) + 'px';
}
function hideTip() { tipEl.classList.remove('show'); }
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('scroll', hideTip, { passive: true });
let rsz = null;
window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (view === 'stats') drawCharts(); else fitStage(); }, 150); });
let lastDay = dayIdx(Date.now());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { clearTimeout(Sync.localTimer); saveLocal(Sync.uid, S); flush(); return; }
  const d = dayIdx(Date.now());
  if (d !== lastDay) { lastDay = d; for (const k of Object.keys(SESS)) { SESS[k].extraNew = 0; SESS[k].cur = null; } refreshAfterDataChange(true); }
});
window.addEventListener('pagehide', () => { clearTimeout(Sync.localTimer); saveLocal(Sync.uid, S); flush(); });

/* ═════════ 14. 啟動 ═════════ */
function boot() {
  const saved = lsGet(STORE_KEY + ':tab');
  const hash = (location.hash || '').slice(1);
  const start = VIEWS.includes(hash) ? hash : VIEWS.includes(saved) ? saved : 'vocab';
  renderCountdown(); renderAcctChip();
  switchView(start);
  if (window.claude && typeof window.claude.use === 'function') {
    setStatus('connecting');
    connectClaude().then(ok => {
      if (ok) return;
      if (FIREBASE_CONFIG) connectFirebase(); else setStatus('local');
    });
  } else if (FIREBASE_CONFIG) connectFirebase();
  else setStatus('local');
}
window.GSAT = {
  schedule, retr, ivlFor, pickNext, queueInfo, deckStats, headBases, fmtChunk, pack, unpack, normalize, stateFromDocs, bucketBody, serialize,
  get state() { return S; }, set state(v) { S = normalize(v); rebuildVocabOrder(); refreshAfterDataChange(true); },
  answer: (deck, g) => { if (!SESS[deck].cur) SESS[deck].cur = pickNext(deck); answer(deck, g); }, SESS, DECKS, dayIdx, dayKey, Sync
};
boot();
})();

</script>
